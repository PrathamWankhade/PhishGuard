services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/data/phishing_detection.db
      - MODEL_DIR=/app/trained_models
    volumes:
      # Persistent SQLite storage; mount versioned model artifacts here.
      - phishing-data:/data
      - ./trained_models:/app/trained_models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Override at build time for deployed origin, e.g.
        # docker compose build --build-arg VITE_API_BASE_URL=https://host/api/v1
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  phishing-data:
